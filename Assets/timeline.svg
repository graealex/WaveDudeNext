<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="898" height="115" viewBox="-5 -1 898 115">
  <image x="0" y="0" width="888" height="91" xlink:href="data:image/png;base64,"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
  <g><title>Playhead: the position shown</title><circle cx="216" cy="10" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="216" y="10" dy=".36em" fill="#000">1</text></g>
  <g><title>In point</title><circle cx="6" cy="10" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="6" y="10" dy=".36em" fill="#000">2</text></g>
  <g><title>Out point</title><circle cx="882" cy="10" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="882" y="10" dy=".36em" fill="#000">3</text></g>
  <g><title>Run the simulation</title><circle cx="17" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="17" y="103" dy=".36em" fill="#000">4</text></g>
  <g><title>Play</title><circle cx="50" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="50" y="103" dy=".36em" fill="#000">5</text></g>
  <g><title>Pause</title><circle cx="74" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="74" y="103" dy=".36em" fill="#000">6</text></g>
  <g><title>One frame back</title><circle cx="107" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="107" y="103" dy=".36em" fill="#000">7</text></g>
  <g><title>One frame forward</title><circle cx="131" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="131" y="103" dy=".36em" fill="#000">8</text></g>
  <g><title>Set the in point</title><circle cx="164" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="164" y="103" dy=".36em" fill="#000">9</text></g>
  <g><title>Set the out point</title><circle cx="188" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="188" y="103" dy=".36em" fill="#000">10</text></g>
  <g><title>Clear the in and out points</title><circle cx="212" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="212" y="103" dy=".36em" fill="#000">11</text></g>
  <g><title>Loop</title><circle cx="236" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="236" y="103" dy=".36em" fill="#000">12</text></g>
  <g><title>Live: follow a running run</title><circle cx="260" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="260" y="103" dy=".36em" fill="#000">13</text></g>
  <g><title>Position: frame of frames</title><circle cx="314" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="314" y="103" dy=".36em" fill="#000">14</text></g>
  <g><title>Step of the position</title><circle cx="376" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="376" y="103" dy=".36em" fill="#000">15</text></g>
  <g><title>Playback speed</title><circle cx="746" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="746" y="103" dy=".36em" fill="#000">16</text></g>
  <g><title>Show the field</title><circle cx="799" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="799" y="103" dy=".36em" fill="#000">17</text></g>
  <g><title>Show the intensity</title><circle cx="823" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="823" y="103" dy=".36em" fill="#000">18</text></g>
  <g><title>Pictures side by side</title><circle cx="847" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="847" y="103" dy=".36em" fill="#000">19</text></g>
  <g><title>Pictures stacked</title><circle cx="871" cy="103" r="9" fill="#FFC107" stroke="#202020" stroke-width="1"/><text x="871" y="103" dy=".36em" fill="#000">20</text></g>
  </g>
</svg>
