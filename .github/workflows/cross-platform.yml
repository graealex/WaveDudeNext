# Contributors: Vinicius Miguel
name: Cross-platform build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Windows x64
            runner: windows-2025
          - name: macOS Apple silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build the Avalonia application
        run: dotnet build WaveDudeNext.Avalonia/WaveDudeNext.Avalonia.csproj --configuration Release -warnaserror
      - name: Build the Windows reference application
        if: runner.os == 'Windows'
        run: dotnet build WaveDudeNext.sln --configuration Release -warnaserror
      - name: Check the shared library
        run: dotnet run --project _tools/library_check --configuration Release
