# The issue form for a problem report: what happened, the system information Help > About copies, and the log file.
name: Problem report
description: Something in WaveDude Next does not work as it should
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. The system information and the log tell most of the story, so please include both.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A project file or a screenshot helps; drag it into the box.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System information
      description: In WaveDude Next, open Help > About, press "Copy system info", and paste here.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag the file WaveDudeNext.WPF.log from the folder of WaveDudeNext.WPF.exe into the box, or paste the lines from the time of the problem.
    validations:
      required: true
